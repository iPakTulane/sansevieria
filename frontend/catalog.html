<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sansevieria Catalog</title>
    <!-- Tailwind CSS -->

    <!-- Google Fonts: Inter -->

    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <!-- Material Symbols Outlined -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link

        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a3cb2a",
                        "background-light": "#f7f8f6",
                        "background-dark": "#1c2012",
                    },
                    fontFamily: {
                        "display": ["Arial", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        /* Custom scrollbar for minimalist look */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #a3cb2a33;
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #a3cb2a;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 h-screen overflow-hidden flex flex-col">
    <!-- Top Navigation Bar -->
    <header

        <!-- Logo / Brand -->
        <div class="flex items-center gap-3">

            </div>
            <a href="index.html"
                class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] hover:text-primary transition-colors">Sansevieria</a>
        </div>

        <!-- Navigation Area -->
        <div class="flex flex-1 justify-end gap-6 items-center">
            <!-- Main Links -->
            <nav class="hidden lg:flex items-center gap-6">
                <a class="text-slate-700 dark:text-slate-300 text-sm font-medium hover:text-primary transition-colors"
                    href="index.html">Home</a>
                <a class="text-slate-700 dark:text-slate-300 text-sm font-medium hover:text-primary transition-colors"
                    href="catalog.html">Catalog</a>
                <a class="text-slate-700 dark:text-slate-300 text-sm font-medium hover:text-primary transition-colors"
                    href="about.html">About</a>
                <a class="text-slate-700 dark:text-slate-300 text-sm font-medium hover:text-primary transition-colors"
                    href="team.html">Team</a>
                <a class="text-slate-700 dark:text-slate-300 text-sm font-medium hover:text-primary transition-colors"
                    href="contact.html">Contact</a>

                <div class="relative group cursor-pointer inline-block z-[100]">
                    <span
                        class="text-slate-700 dark:text-slate-300 text-sm font-medium hover:text-primary transition-colors flex items-center gap-1 py-4">More
                        <span class="material-symbols-outlined text-[1rem]">expand_more</span></span>
                    <div
                        class="absolute right-0 top-full -mt-2 w-48 bg-white dark:bg-slate-800 rounded-lg shadow-xl border border-primary/10 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all flex flex-col p-2 z-[100]">
                        <a href="varieties.html"
                            class="px-3 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-primary/5 hover:text-primary rounded-md transition-colors">Varieties</a>
                        <a href="care.html"
                            class="px-3 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-primary/5 hover:text-primary rounded-md transition-colors">Care</a>
                        <a href="problems.html"
                            class="px-3 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-primary/5 hover:text-primary rounded-md transition-colors">Problems</a>
                        <a href="blog.html"
                            class="px-3 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-primary/5 hover:text-primary rounded-md transition-colors">Blog</a>
                        <div class="h-px w-full bg-primary/10 my-1"></div>
                    </div>
                </div>
            </nav>

            <!-- Action Buttons -->
            <div class="flex items-center gap-3">
                <a href="cart.html"
                    class="flex items-center justify-center p-2 rounded-full hover:bg-primary/10 transition-colors"
                    title="Cart">
                    <span class="material-symbols-outlined text-slate-600 dark:text-slate-300">shopping_cart</span>
                </a>
                <a href="auth.html"
                    class="flex items-center justify-center p-2 rounded-full hover:bg-primary/10 transition-colors"
                    title="Auth/Login">
                    <span class="material-symbols-outlined text-slate-600 dark:text-slate-300">login</span>
                </a>
                <a href="dashboard.html"
                    class="flex flex-shrink-0 items-center justify-center p-2 rounded-full hover:bg-primary/10 transition-colors"
                    title="Dashboard">
                    <span class="material-symbols-outlined text-slate-600 dark:text-slate-300">account_circle</span>
                </a>
            </div>
        </div>
    </header>
    <main class="flex flex-1 overflow-hidden">
        <!-- Sidebar Filters -->
        <aside
            class="w-64 border-r border-primary/10 bg-white dark:bg-background-dark/30 p-8 flex flex-col gap-8 shrink-0">
            <div>
                <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-6">Filters</h3>
                <!-- Size Category -->
                <div class="mb-8">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-sm font-semibold flex items-center gap-2">
                            <span class="material-symbols-outlined text-lg">straighten</span> Size
                        </span>
                    </div>
                    <div class="space-y-3">
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input checked=""
                                class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary bg-transparent"
                                type="checkbox" />
                            <span
                                class="text-sm text-slate-600 dark:text-slate-400 group-hover:text-primary transition-colors">Small
                                (4-6")</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input
                                class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary bg-transparent"
                                type="checkbox" />
                            <span
                                class="text-sm text-slate-600 dark:text-slate-400 group-hover:text-primary transition-colors">Medium
                                (8-12")</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input
                                class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary bg-transparent"
                                type="checkbox" />
                            <span
                                class="text-sm text-slate-600 dark:text-slate-400 group-hover:text-primary transition-colors">Large
                                (15"+)</span>
                        </label>
                    </div>
                </div>
                <!-- Light Needs -->
                <div class="mb-8">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-sm font-semibold flex items-center gap-2">
                            <span class="material-symbols-outlined text-lg">wb_sunny</span> Light Needs
                        </span>
                    </div>
                    <div class="space-y-3">
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input
                                class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary bg-transparent"
                                type="checkbox" />
                            <span
                                class="text-sm text-slate-600 dark:text-slate-400 group-hover:text-primary transition-colors">Low
                                Light</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input checked=""
                                class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary bg-transparent"
                                type="checkbox" />
                            <span
                                class="text-sm text-slate-600 dark:text-slate-400 group-hover:text-primary transition-colors">Indirect</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input
                                class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary bg-transparent"
                                type="checkbox" />
                            <span
                                class="text-sm text-slate-600 dark:text-slate-400 group-hover:text-primary transition-colors">Bright</span>
                        </label>
                    </div>
                </div>
                <!-- Price Range -->
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-sm font-semibold flex items-center gap-2">

                        </span>
                    </div>
                    <div class="px-1">
                        <input class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-primary"
                            type="range" />
                        <div class="flex justify-between mt-2 text-[10px] font-bold text-slate-400">
                            <span>$10</span>
                            <span>$150+</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mt-auto">
                <button
                    class="w-full py-2.5 bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-lg text-xs font-bold uppercase tracking-widest hover:bg-primary dark:hover:bg-primary dark:hover:text-white transition-all">
                    Reset All
                </button>
            </div>
        </aside>
        <!-- Product Grid Area -->
        <section class="flex-1 bg-background-light dark:bg-background-dark p-8 overflow-y-auto custom-scrollbar">
            <div class="max-w-6xl mx-auto">
                <div class="flex items-end justify-between mb-10">
                    <div>
                        <h1 class="text-3xl font-bold mb-2">The Collection</h1>
                        <p class="text-slate-500 text-sm">Showing 8 premium snake plant varieties</p>
                    </div>
                    <div class="flex items-center gap-4 text-sm font-medium text-slate-500">
                        <span>Sort by:</span>
                        <button class="flex items-center gap-1 text-slate-900 dark:text-white">
                            Recommended <span class="material-symbols-outlined">expand_more</span>
                        </button>
                    </div>
                </div>
                <!-- Responsive Grid -->
                <div id="productList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-10">
                    <!-- Products will be injected here dynamically -->
                    <div class="col-span-full flex justify-center py-20 text-slate-400">
                        <span class="material-symbols-outlined animate-spin text-4xl">progress_activity</span>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- API Integration Script -->
    <script src="js/api.js"></script>
    <script>
        function viewProduct(productId) {
            window.location.href = `product.html?id=${productId}`;
        }

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const products = await apiRequest("/api/products/", "GET");

                const container = document.getElementById("productList");
                container.innerHTML = "";

                if (!products || products.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center text-slate-500">No products available.</div>';
                    return;
                }

                products.forEach(product => {
                    const card = document.createElement("div");
                    card.className = "group cursor-pointer";
                    card.onclick = () => viewProduct(product.id);

                    // Fallback image if backend doesn't provide one
                    const imageUrl = product.image_url || 'https://images.unsplash.com/photo-1599598425947-33002629eb8f?auto=format&fit=crop&q=80&w=800';

                    card.innerHTML = `
                    <div class="relative aspect-square rounded-xl overflow-hidden bg-slate-200 mb-4">
                        <div class="absolute inset-0 bg-cover bg-center transition-transform duration-500 group-hover:scale-110"
                            style="background-image: url('${imageUrl}');">
                        </div>
                        <div class="absolute bottom-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity translate-y-2 group-hover:translate-y-0 duration-300">
                            <button class="w-10 h-10 bg-primary text-white rounded-full flex items-center justify-center shadow-lg hover:scale-110 transition-transform">
                                <span class="material-symbols-outlined text-xl">add</span>
                            </button>
                        </div>
                    </div>
                    <h3 class="font-semibold text-slate-900 dark:text-white group-hover:text-primary transition-colors">
                        ${product.name}
                    </h3>
                    <p class="text-slate-500 text-sm font-medium">$${Number(product.price).toFixed(2)}</p>
                `;

                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Failed to load products", err);
                const container = document.getElementById("productList");
                container.innerHTML = '<div class="col-span-full text-center text-red-500">Failed to load catalog. Please try again later.</div>';
            }
        });
    </script>
</body>

</html>
